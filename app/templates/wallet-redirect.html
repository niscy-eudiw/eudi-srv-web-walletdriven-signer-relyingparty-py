{% extends 'base.html' %} {% block content %}
<div class="page-centered">
  <h1>Sign documents</h1>
  <p>Scan the QrCode to sign the document with the EUDI Wallet</p>

  <div id="redirect-wallet">
    <div class="col-md-12" style="display: flex; flex-direction: column; align-items: center">
      <img src="{{ qrcode }}" alt="QRCode for Document Retrieval" style="width: 200px; height: 200px"/>
      <a class="btn primary-btn" href="{{ url }}" target="_blank" style="color: white; text-decoration: none; margin-top: 16px;">
        <div>
          <p style="margin-bottom: 0px">Go to EUDI Wallet</p>
          <p style="margin-bottom: 0px; font-size: 12px">(Same Device)</p>
        </div>
      </a>
    </div>
    <div id="loading-message" class="alert alert-info" style="margin-top: 20px">
      Waiting for the signed document...
    </div>
    <div id="error-message" class="alert alert-danger" style="margin-top: 20px" hidden></div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", fetchAndUpdatePage);
  const requestUrl = "{{ retrieve_signed_document_url }}";
  const nonce = "{{ nonce }}";

  async function fetchAndUpdatePage() {
    let response_status = 404;
    let response_json;
    const timeout = Date.now() + 60 * 10 * 1000; // 10 minutes

    while (response_status != 200 && Date.now() < timeout) {
  	  try{
  		  const response = await fetch(requestUrl);
    	  if (response.status === 200) {
      		response_status = 200;
    	  } else {
      		console.error("Waiting for signed document...");
      		await new Promise((resolve) => setTimeout(resolve, 15000)); // 15s
    	  }
      } catch (err) {
    	  console.error("Polling error: ", err);
    	  await new Promise((resolve) => setTimeout(resolve, 15000));
      }
    }

    if (response_status != 200) {
      document.getElementById("loading-message").hidden=true;
      const errorMessageDiv = document.getElementById("error-message");
      errorMessageDiv.innerText = "Relying Party Tester timed out while waiting for the signed document from the Wallet.";
      errorMessageDiv.hidden=true;
    } else {
      window.location.href = "{{ url_for('documents.view_signed_document') }}?nonce=" + encodeURIComponent(nonce);
    }
  }
</script>
{% endblock %}
